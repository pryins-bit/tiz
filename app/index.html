<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>수니TV</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .suni-word { font-weight:900; letter-spacing:-2px; }
    .suni-tv { margin-left:9px; font-size:.72em; font-weight:800; opacity:.9; letter-spacing:1px; }
    .mom-weather-panel { margin-top:18px; padding:18px; border:1px solid rgba(255,255,255,.12); border-radius:18px; background:rgba(255,255,255,.055); }
    .mom-weather-title { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px; font-size:25px; font-weight:800; }
    .mom-weather-title small { font-size:15px; font-weight:500; opacity:.55; }
    .mom-weather-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .mom-weather-card { min-width:0; padding:14px 15px; border-radius:14px; background:rgba(255,255,255,.08); }
    .weather-place { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
    .weather-place b { font-size:21px; }
    .weather-place small { font-size:13px; opacity:.55; }
    .weather-main { display:flex; align-items:center; gap:8px; margin:8px 0 5px; }
    .weather-main strong { font-size:34px; }
    .weather-main > span:last-child { font-size:15px; opacity:.78; }
    .weather-icon { font-size:28px; }
    .weather-meta,.weather-tomorrow { font-size:14px; line-height:1.5; opacity:.72; }
    .weather-tomorrow { opacity:.55; }
    .weather-error,.mom-weather-card.loading { opacity:.65; }

    .mom-home.pip-active { left:1240px !important; top:0 !important; right:0 !important; bottom:0 !important; width:auto !important; padding:26px 28px 24px !important; border-left:1px solid rgba(255,255,255,.14) !important; background:rgba(10,16,26,.985) !important; box-shadow:-18px 0 50px rgba(0,0,0,.25) !important; }
    .mom-home.pip-active .mom-head { gap:18px; padding-bottom:13px; }
    .mom-home.pip-active .mom-title { font-size:34px; }
    .mom-home.pip-active .mom-clock { margin-top:5px; font-size:18px; }
    .mom-home.pip-active .mom-state { max-width:210px; font-size:15px; }
    .mom-home.pip-active .mom-actions { margin-top:12px; gap:8px; }
    .mom-home.pip-active .mom-tv-button { min-width:0; padding:10px 13px; border-radius:10px; font-size:17px; }
    .mom-home.pip-active .mom-weather-panel { margin-top:12px; padding:13px; }
    .mom-home.pip-active .mom-weather-title { margin-bottom:9px; font-size:20px; }
    .mom-home.pip-active .mom-weather-card { padding:11px; }
    .mom-home.pip-active .weather-place b { font-size:18px; }
    .mom-home.pip-active .weather-main strong { font-size:28px; }
    .mom-home.pip-active .weather-icon { font-size:23px; }
    .mom-home.pip-active .weather-meta,.mom-home.pip-active .weather-tomorrow { font-size:12px; }
    .mom-home.pip-active .mom-content { margin-top:12px; display:grid; grid-template-columns:1fr; gap:12px; height:auto; max-height:420px; overflow:hidden; }
    .mom-home.pip-active .mom-column { padding:13px; border-radius:13px; }
    .mom-home.pip-active .mom-section-title { margin-bottom:8px; font-size:19px; }
    .mom-home.pip-active .mom-card,.mom-home.pip-active .stock-row { padding:10px 11px; border-radius:9px; }
    .mom-home.pip-active .mom-card-title,.mom-home.pip-active .stock-name { font-size:17px; }
    .mom-home.pip-active .mom-card-body,.mom-home.pip-active .stock-price,.mom-home.pip-active .stock-change { font-size:14px; }
    #video.mom-html5-pip { left:0 !important; top:0 !important; right:auto !important; bottom:auto !important; width:64.583333% !important; height:100% !important; object-fit:contain !important; }
  </style>
  <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
  <script>
    (function () {
      'use strict';

      // R5 startup rescue lives in the installed shell, before bootstrap.js.
      // It deliberately does not depend on the remotely cached runtime: the
      // first playlist request races the network against the packaged M3U so a
      // hanging GitHub request cannot leave an old runtime on the loading text.
      var SHELL_BUILD = '2026.08.17.5';
      var PLAYLIST_RAW = 'https://raw.githubusercontent.com/pryins-bit/tiz/main/korea.m3u';
      var PLAYLIST_CDN = 'https://cdn.jsdelivr.net/gh/pryins-bit/tiz@main/korea.m3u';
      var LOCAL_DELAY_MS = 120;
      window.KoreaTVShellBuild = SHELL_BUILD;

      if (typeof window.fetch === 'function') {
        var nativeFetch = window.fetch.bind(window);
        window.__SuniTVNativeFetch = nativeFetch;

        function isPlaylistUrl(url) {
          return url.indexOf(PLAYLIST_RAW) === 0 || url.indexOf(PLAYLIST_CDN) === 0;
        }

        function localPlaylistFetch() {
          return nativeFetch('korea.m3u?t=' + Date.now(), { cache: 'no-store' }).then(function (response) {
            if (!response || !response.ok) throw new Error('packaged playlist HTTP ' + (response ? response.status : 0));
            return response;
          });
        }

        window.fetch = function (input, options) {
          var url = typeof input === 'string' ? input : String(input && input.url || '');
          if (!isPlaylistUrl(url)) return nativeFetch(input, options);

          var remote = nativeFetch(input, options || { cache: 'no-store' }).then(function (response) {
            if (!response || !response.ok) throw new Error('remote playlist HTTP ' + (response ? response.status : 0));
            return response;
          });
          var local = new Promise(function (resolve, reject) {
            setTimeout(function () {
              localPlaylistFetch().then(resolve, reject);
            }, LOCAL_DELAY_MS);
          });

          return Promise.race([remote, local]).catch(function () {
            return localPlaylistFetch();
          });
        };
      }

      document.addEventListener('DOMContentLoaded', function () {
        var mom = document.getElementById('momHome');
        var state = document.getElementById('momState');
        if (mom) mom.classList.remove('hidden');
        if (state) state.textContent = 'R5 · 시작 준비 중…';
      });
    }());
  </script>
  <script defer src="bootstrap.js"></script>
</head>
<body>
  <object id="av-player" type="application/avplayer"></object>
  <video id="video" autoplay playsinline></video>
  <div id="dim" class="dim hidden"></div>

  <section id="tvHome" class="tv-home hidden" aria-live="polite">
    <header class="home-head">
      <div>
        <div class="home-brand"><span class="suni-word">수니</span><span class="suni-tv">TV</span></div>
        <div id="homeClock" class="home-clock"></div>
      </div>
      <div class="home-now">
        <div class="eyebrow">NOW</div>
        <div id="homeNowName" class="home-now-name">채널 불러오는 중…</div>
      </div>
    </header>

    <div class="quick-grid" id="quickGrid">
      <button class="quick-card focusable" data-action="continue"><span class="quick-icon">▶</span><b>TV 계속 보기</b><small>현재 채널로 돌아가기</small></button>
      <button class="quick-card focusable" data-action="favorites"><span class="quick-icon">★</span><b>즐겨찾기</b><small id="favCount">0개</small></button>
      <button class="quick-card focusable" data-action="recent"><span class="quick-icon">↶</span><b>최근 채널</b><small>최근 본 방송</small></button>
      <button class="quick-card focusable" data-action="categories"><span class="quick-icon">▦</span><b>카테고리</b><small>공중파 · 영화 · 뉴스 등</small></button>
      <button class="quick-card focusable" data-action="search"><span class="quick-icon">⌕</span><b>채널 검색</b><small>리모컨 키보드 지원</small></button>
      <button class="quick-card focusable" data-action="mom"><span class="quick-icon">♥</span><b>엄마 TV 홈</b><small>날씨 · 일정 · 관심 시세</small></button>
      <button class="quick-card focusable" data-action="health"><span class="quick-icon">✓</span><b>채널 상태</b><small id="healthText">실패 기록 없음</small></button>
      <button class="quick-card focusable" data-action="report"><span class="quick-icon">!</span><b>현재 채널 제외</b><small>안 나오는 채널 기억</small></button>
    </div>

    <div class="home-section-head">
      <div id="homeListTitle" class="home-section-title">즐겨찾기 / 최근 채널</div>
      <div class="key-hints"><span class="red-dot"></span>홈 <span class="green-dot"></span>즐겨찾기 <span class="yellow-dot"></span>검색 <span class="blue-dot"></span>카테고리</div>
    </div>
    <div id="homeChannelList" class="channel-strip"></div>
  </section>

  <section id="browserPanel" class="browser-panel hidden">
    <div class="browser-head">
      <div>
        <div id="browserTitle" class="browser-title">채널</div>
        <div id="browserSubtitle" class="browser-subtitle"></div>
      </div>
      <button class="close-button focusable" data-action="close-browser">닫기</button>
    </div>
    <div id="categoryTabs" class="category-tabs"></div>
    <div id="browserList" class="browser-list"></div>
  </section>

  <section id="searchPanel" class="search-panel hidden">
    <div class="search-box">
      <div class="search-title">채널 검색</div>
      <input id="searchInput" class="search-input" type="text" autocomplete="off" placeholder="예: 중국, 영화, KBS, 스포츠" />
      <div class="search-help">확인 버튼으로 입력 · 검색어가 바뀌면 즉시 필터됩니다.</div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </section>

  <section id="momHome" class="mom-home hidden" aria-live="polite">
    <div class="mom-head">
      <div><div class="mom-title"><span class="suni-word">수니</span><span class="suni-tv">TV</span> · 엄마 홈</div><div id="momClock" class="mom-clock"></div></div>
      <div id="momState" class="mom-state">R5 · 시작 준비 중…</div>
    </div>
    <div class="mom-actions">
      <button class="mom-tv-button focusable" data-action="watch-tv">▶ TV 보기</button>
      <button class="mom-tv-button focusable secondary" data-action="open-tv-home">TV 채널 홈</button>
    </div>
    <div id="momApproval" class="approval hidden">
      <div class="approval-label">이 TV를 한 번만 승인하세요</div>
      <div id="approvalCode" class="approval-code">------</div>
      <div class="approval-help">승인 후에는 이 TV에 토큰이 저장되어 자동 연결됩니다.</div>
    </div>
    <div id="momContent" class="mom-content hidden">
      <div class="mom-column"><div class="mom-section-title">오늘</div><div id="momItems" class="mom-items"></div></div>
      <div class="mom-column stocks-column"><div class="mom-section-title">관심 시세</div><div id="momStocks" class="mom-stocks"></div></div>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <div id="status" class="status">업데이트 확인 중…</div>
  <div id="banner" class="banner hidden">
    <div id="channelName" class="channel-name"></div>
    <div id="channelMeta" class="channel-meta"></div>
  </div>
  <div id="help" class="help hidden">숫자키: 채널번호 · 채널 위/+ : 번호 증가 · 채널 아래/- : 번호 감소 · 빨강: 홈 · 초록: 즐겨찾기 · 노랑: 검색 · 파랑: 카테고리 · 확인: 정보</div>

  <script>
    (function () {
      function installPipDimGuard() {
        var mom = document.getElementById('momHome');
        var dim = document.getElementById('dim');
        if (!mom || !dim || typeof MutationObserver === 'undefined') return;
        function sync() {
          if (mom.classList.contains('pip-active')) dim.classList.add('hidden');
        }
        var observer = new MutationObserver(sync);
        observer.observe(mom, { attributes: true, attributeFilter: ['class'] });
        sync();
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', installPipDimGuard);
      else installPipDimGuard();
    }());
  </script>
</body>
</html>
