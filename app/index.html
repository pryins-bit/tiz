<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>수니TV</title>
  <link rel="stylesheet" href="style.css" />
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script defer src="bootstrap.js"></script>
</head>
<body>
  <!-- AVPlay renders on Samsung's hardware video plane. Keep this one object as
       the first body child and keep the page transparent over it. -->
  <object id="av-player" type="application/avplayer"></object>
  <video id="html5-player" autoplay playsinline></video>

  <main id="ui" aria-live="polite">
    <div id="loading" class="loading-card">
      <div class="brand">수니TV</div>
      <div class="loading-line">내 채널 목록을 불러오는 중…</div>
    </div>

    <div id="osd" class="osd hidden">
      <div id="osdNumber" class="osd-number">1</div>
      <div class="osd-copy">
        <div id="osdName" class="osd-name">채널</div>
        <div id="osdMeta" class="osd-meta"></div>
      </div>
    </div>

    <div id="errorToast" class="error-toast hidden"></div>
    <div id="status" class="status">SKY CORE 준비 중…</div>
    <div id="diagnostic" class="diagnostic">SKY CORE · BOOT</div>
  </main>
</body>
</html>
