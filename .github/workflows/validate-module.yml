name: Validate TizenBrew module

on:
  pull_request:
    paths:
      - "package.json"
      - "app/**"
      - "tizen-standalone/config.xml"
      - "scripts/sync_tizen_standalone.py"
      - "scripts/validate_remote_contract.py"
      - "scripts/test_remote_input_runtime.js"
      - "scripts/test_avplay_adapter.js"
      - "scripts/test_channel_policy.js"
      - "scripts/test_kbs_provider.js"
      - "scripts/test_rf_tuner.js"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/validate-module.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "app/**"
      - "tizen-standalone/config.xml"
      - "scripts/sync_tizen_standalone.py"
      - "scripts/validate_remote_contract.py"
      - "scripts/test_remote_input_runtime.js"
      - "scripts/test_avplay_adapter.js"
      - "scripts/test_channel_policy.js"
      - "scripts/test_kbs_provider.js"
      - "scripts/test_rf_tuner.js"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/validate-module.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest and entrypoint
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); if(p.packageType!=='app') throw new Error('packageType must be app'); if(!p.appName) throw new Error('appName missing'); if(!p.appPath || !fs.existsSync(p.appPath)) throw new Error('appPath missing');"
      - name: Check JavaScript syntax
        run: |
          node --check app/main.js
          node --check app/numeric-remote.js
          node --check app/remote-input.js
          node --check app/avplay-adapter.js
          node --check app/channel-policy.js
          node --check app/kbs-provider.js
          node --check app/rf-tuner.js
          node --check scripts/test_remote_input_runtime.js
          node --check scripts/test_avplay_adapter.js
          node --check scripts/test_channel_policy.js
          node --check scripts/test_kbs_provider.js
          node --check scripts/test_rf_tuner.js
      - name: Simulate Samsung remote regressions
        run: node scripts/test_remote_input_runtime.js
      - name: Simulate Samsung AVPlay lifecycle
        run: node scripts/test_avplay_adapter.js
      - name: Simulate audience channel policy
        run: node scripts/test_channel_policy.js
      - name: Simulate KBS official service_url provider
        run: node scripts/test_kbs_provider.js
      - name: Simulate Tizen TVWindow RF lifecycle
        run: node scripts/test_rf_tuner.js
      - name: Verify Samsung remote input contract
        run: python scripts/validate_remote_contract.py
      - name: Verify combined shell contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text(encoding='utf-8')
          assert html.index('src="channel-policy.js"') < html.index('src="kbs-provider.js"') < html.index('src="bootstrap.js"') < html.index('src="rf-tuner.js"')
          sync = Path('scripts/sync_tizen_standalone.py').read_text(encoding='utf-8')
          assert "'channel-policy.js'" in sync and "'kbs-provider.js'" in sync and "'rf-tuner.js'" in sync
          provider = Path('app/kbs-provider.js').read_text(encoding='utf-8')
          assert 'cfpwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/' in provider
          assert "channelCode: '11'" in provider and "channelCode: '12'" in provider
          assert 'channel_item' in provider and 'service_url' in provider
          assert 'vthanhtivi' not in provider
          policy = Path('app/channel-policy.js').read_text(encoding='utf-8')
          for key in ('bloombergtv','france24_en','euronews_en','fifaplus_en','trtworld','newsmax','ntd'):
              assert key in policy
          PY
          grep -F 'http://tizen.org/privilege/tv.window' tizen-standalone/config.xml
      - name: Verify fixed playlist contract
        run: grep -F "https://raw.githubusercontent.com/pryins-bit/tiz/main/korea.m3u" app/main.js
