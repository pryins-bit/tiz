name: Update Korea IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - "scripts/update_playlist.py"
      - "korea.m3u"
      - ".github/workflows/update-playlist.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate playlist
        run: python scripts/update_playlist.py

      - name: Validate generated playlist
        shell: bash
        run: |
          set -euo pipefail
          test "$(head -n 1 korea.m3u)" = "#EXTM3U"
          test "$(grep -c '^#EXTINF:' korea.m3u)" -gt 0
          awk '
            /^#EXTINF:/ { need_url=1; next }
            need_url && /^https?:\/\/.*\.m3u8([?].*)?$/ { need_url=0; next }
            need_url { print "Invalid URL after EXTINF: " $0 > "/dev/stderr"; exit 1 }
            END { if (need_url) exit 1 }
          ' korea.m3u

      - name: Commit changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- korea.m3u; then
            echo "Playlist is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea.m3u
          git commit -m "chore: refresh Korea IPTV playlist"
          git push
