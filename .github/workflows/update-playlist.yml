name: Update Korea IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/approve_current_candidates.py"
      - "scripts/update_playlist.py"
      - "approved_channels.json"
      - "korea.m3u"
      - ".github/workflows/update-playlist.yml"
  pull_request:
    paths:
      - "scripts/approve_current_candidates.py"
      - "scripts/update_playlist.py"
      - "approved_channels.json"
      - "korea.m3u"
      - ".github/workflows/update-playlist.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize approved channel snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f approved_channels.json ]]; then
            python scripts/approve_current_candidates.py
          else
            echo "approved_channels.json already exists; keeping reviewed promotion set"
          fi

      - name: Generate playlist
        run: python scripts/update_playlist.py

      - name: Validate generated playlist
        shell: bash
        run: |
          set -euo pipefail
          test "$(head -n 1 korea.m3u)" = "#EXTM3U"
          test "$(grep -c '^#EXTINF:' korea.m3u)" -gt 0
          awk '
            /^#EXTINF:/ { need_url=1; next }
            need_url && /^https?:\/\/.*\.m3u8([?].*)?$/ { need_url=0; next }
            need_url { print "Invalid URL after EXTINF: " $0 > "/dev/stderr"; exit 1 }
            END { if (need_url) exit 1 }
          ' korea.m3u

      - name: Commit changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add approved_channels.json korea.m3u
          if git diff --cached --quiet; then
            echo "Playlist is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh approved Korea IPTV playlist"
          git push
