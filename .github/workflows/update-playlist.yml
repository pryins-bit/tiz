name: Update Korea IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/approve_current_candidates.py"
      - "scripts/update_playlist.py"
      - "approved_channels.json"
      - "korea.m3u"
      - ".github/workflows/update-playlist.yml"
  pull_request:
    paths:
      - "scripts/approve_current_candidates.py"
      - "scripts/update_playlist.py"
      - "approved_channels.json"
      - "korea.m3u"
      - ".github/workflows/update-playlist.yml"

permissions:
  contents: write

concurrency:
  group: korea-tv-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize approved channel snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f approved_channels.json ]]; then
            python scripts/approve_current_candidates.py
          else
            echo "approved_channels.json already exists; keeping reviewed promotion set"
          fi

      - name: Generate playlist
        run: python scripts/update_playlist.py

      - name: Validate generated Update 1 playlist
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.update_playlist import validate

          text = Path('korea.m3u').read_text(encoding='utf-8')
          validate(text)
          count = sum(1 for line in text.splitlines() if line.startswith('#EXTINF:'))
          assert count == 56, f'Update 1 playlist must contain exactly 56 visible channels, got {count}'
          assert 'tvg-id="KBS1.official"' in text
          assert 'tvg-id="KBS2.official"' in text
          print('Update 1 playlist OK: 54 ordinary + KBS1/KBS2 = 56')
          PY

      - name: Commit changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add approved_channels.json korea.m3u
          if git diff --cached --quiet; then
            echo "Playlist is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh approved Korea IPTV playlist"
          git pull --rebase origin main
          git push