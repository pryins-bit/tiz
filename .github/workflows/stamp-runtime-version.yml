name: Stamp runtime version

on:
  push:
    branches: [main]
    paths:
      - 'app/brand-runtime.js'
      - 'app/main.js'
      - 'app/numeric-remote.js'
      - 'app/remote-input.js'
      - 'app/avplay-adapter.js'
      - 'app/style.css'

permissions:
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp runtime manifest with source commit
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('app/runtime-version.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['version'] = os.environ['GITHUB_SHA']
          data['files'] = ['brand-runtime.js', 'remote-input.js', 'numeric-remote.js', 'avplay-adapter.js', 'main.js', 'style.css']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('runtime version:', data['version'])
          PY
      - name: Commit runtime version stamp
        run: |
          if git diff --quiet -- app/runtime-version.json; then
            echo 'No runtime version change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/runtime-version.json
          git commit -m 'chore: stamp runtime version'

          # Playlist/market/stream-refresh workflows can push to main at the
          # same time. Rebase the tiny stamp commit onto the newest main and
          # retry instead of losing the runtime update with a non-fast-forward.
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Runtime stamp rebase conflicted; refusing to overwrite main.'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Runtime stamp push raced with another writer (attempt ${attempt}); retrying..."
            sleep $((attempt * 2))
          done
          echo 'Runtime stamp could not be pushed after retries.'
          exit 1
      - name: Purge jsDelivr branch cache for runtime files
        run: |
          # The TV races GitHub Raw, jsDelivr and the Supabase rescue endpoint.
          # jsDelivr caches GitHub branch URLs, so a stale CDN response can win
          # that race even after the manifest version changed. Purge every fixed
          # runtime URL after the source + stamped manifest are on main.
          files=(
            runtime-version.json
            brand-runtime.js
            remote-input.js
            numeric-remote.js
            avplay-adapter.js
            main.js
            style.css
          )
          for file in "${files[@]}"; do
            ok=0
            url="https://purge.jsdelivr.net/gh/pryins-bit/tiz@main/app/${file}"
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error "$url" -o "/tmp/purge-${file//\//_}.json"; then
                echo "Purged ${file}"
                ok=1
                break
              fi
              sleep $((attempt * 2))
            done
            if [ "$ok" -ne 1 ]; then
              echo "Failed to purge jsDelivr cache for ${file}"
              exit 1
            fi
          done
      - name: Refresh fast Supabase rescue manifest cache
        run: |
          # This public endpoint accepts no version/body from the caller. It
          # re-reads the trusted GitHub runtime manifest server-side and only
          # refreshes the public rescue cache, so no Supabase secret is needed.
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              'https://inzopchhmvljprbpvzcs.supabase.co/functions/v1/tv-runtime?action=refresh' \
              -o /tmp/tv-runtime-refresh.json; then
              cat /tmp/tv-runtime-refresh.json
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Supabase runtime manifest cache refresh failed.'
          exit 1
