name: Refresh Mom OS market data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 0-6 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/update_market.py'
      - '.github/workflows/refresh-market.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public stock JSON
        run: python scripts/update_market.py
      - name: Validate generated JSON
        run: |
          python -m json.tool market.json >/dev/null
          python scripts/update_market.py --validate-template
      - name: Commit quote update
        run: |
          if git diff --quiet -- market.json; then
            echo 'No market data change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market.json
          git commit -m 'data: refresh Mom OS market quotes'
          git push
