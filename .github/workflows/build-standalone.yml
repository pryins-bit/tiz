name: Build standalone Tizen app

# V2 release: signed WGT must contain the finalized 47-channel contract.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tizen-standalone/**'
      - 'scripts/sync_tizen_standalone.py'
      - 'scripts/validate_remote_contract.py'
      - 'scripts/test_remote_input_runtime.js'
      - 'scripts/test_avplay_adapter.js'
      - 'scripts/test_update1_runtime.js'
      - '.github/workflows/build-standalone.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tizen-standalone/**'
      - 'scripts/sync_tizen_standalone.py'
      - 'scripts/validate_remote_contract.py'
      - 'scripts/test_remote_input_runtime.js'
      - 'scripts/test_avplay_adapter.js'
      - 'scripts/test_update1_runtime.js'
      - '.github/workflows/build-standalone.yml'

permissions:
  contents: write

env:
  TIZEN_STUDIO_VER: '5.6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate shared JavaScript
        run: |
          node --check app/bootstrap.js
          node --check app/main.js
          node --check app/numeric-remote.js
          node --check app/remote-input.js
          node --check app/avplay-adapter.js
          node --check app/channel-policy.js
          node --check app/kbs-provider.js
          node --check scripts/test_remote_input_runtime.js
          node --check scripts/test_avplay_adapter.js
          node --check scripts/test_update1_runtime.js

      - name: Simulate Samsung remote regressions
        run: node scripts/test_remote_input_runtime.js

      - name: Simulate Samsung AVPlay lifecycle
        run: node scripts/test_avplay_adapter.js

      - name: Validate V2 47-channel contract
        run: node scripts/test_update1_runtime.js

      - name: Validate Samsung remote input and updater contract
        run: python scripts/validate_remote_contract.py

      - name: Build standalone project
        run: python scripts/sync_tizen_standalone.py

      - name: Stamp rolling package version without rewriting XML namespaces
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('tizen-standalone/build/config.xml')
          text = path.read_text(encoding='utf-8')
          run_number = int(os.environ['GITHUB_RUN_NUMBER'])
          version = f'0.5.{run_number}'
          updated, count = re.subn(
              r'(<widget\b[^>]*\bversion=")[^"]+("[^>]*>)',
              rf'\g<1>{version}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not stamp widget version')
          path.write_text(updated, encoding='utf-8')
          print('WGT version:', version)
          PY

      - name: Validate Tizen manifest and Installer parser contract
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('tizen-standalone/build/config.xml')
          text = path.read_text(encoding='utf-8')
          root = ET.parse(path).getroot()
          assert root.attrib.get('version')
          assert root.find('{http://www.w3.org/ns/widgets}content') is not None
          app = root.find('{http://tizen.org/ns/widgets}application')
          assert app is not None, 'tizen:application missing'
          package_id = app.attrib.get('package', '')
          application_id = app.attrib.get('id', '')
          assert re.fullmatch(r'[A-Za-z0-9]{10}', package_id), f'invalid Tizen package id: {package_id!r}'
          assert application_id.startswith(package_id + '.'), (
              f'application id {application_id!r} must start with {package_id!r} + dot'
          )
          privileges = {
              node.attrib.get('name')
              for node in root.findall('{http://tizen.org/ns/widgets}privilege')
          }
          assert 'http://tizen.org/privilege/tv.inputdevice' in privileges, 'tv.inputdevice privilege missing'
          assert 'http://tizen.org/privilege/tv.window' not in privileges, 'V2 must not contain RF tv.window privilege'
          assert '<widget ' in text or '<widget\n' in text
          assert '<tizen:application ' in text
          assert 'xmlns:tizen="http://tizen.org/ns/widgets"' in text
          assert '<ns0:widget' not in text
          assert '<ns1:application' not in text
          print('config.xml OK for TizenBrew Installer parser, Tizen IDs, TV input privilege, and no RF privilege')
          PY

      - name: Download Tizen Studio CLI
        run: |
          curl --fail --location --retry 3 \
            -o tizen-installer \
            "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "${GITHUB_WORKSPACE}/tizen-studio"
          rm tizen-installer

      - name: Create ephemeral author certificate and old-Tizen signing profile
        shell: bash
        run: |
          set -euo pipefail
          TIZEN="${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin/tizen"
          DATA="${GITHUB_WORKSPACE}/tizen-studio-data"
          AUTHOR_DIR="${DATA}/keystore/author"
          PROFILE_DIR="${DATA}/profile"
          mkdir -p "$AUTHOR_DIR" "$PROFILE_DIR"

          AUTHOR_PW="Ktv$(openssl rand -hex 16)Aa1"
          echo "AUTHOR_PW=$AUTHOR_PW" >> "$GITHUB_ENV"

          "$TIZEN" certificate \
            -a KoreaTV \
            -p "$AUTHOR_PW" \
            -c KR \
            -s Daegu \
            -ct Daegu \
            -o pryins-bit \
            -u TV \
            -n "Korea TV" \
            -e "pryins-bit@users.noreply.github.com" \
            -f koreatv-author \
            -- "$AUTHOR_DIR"

          cat > "$PROFILE_DIR/profiles.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="KoreaTV-Old" version="3.1">
            <profile name="KoreaTV-Old">
              <profileitem ca="${GITHUB_WORKSPACE}/tizen-studio/tools/certificate-generator/certificates/developer/tizen-developer-ca.cer" distributor="0" key="${AUTHOR_DIR}/koreatv-author.p12" password="${AUTHOR_PW}" rootca=""/>
              <profileitem ca="${GITHUB_WORKSPACE}/tizen-studio/tools/certificate-generator/certificates/distributor/sdk-public/tizen-distributor-ca.cer" distributor="1" key="${GITHUB_WORKSPACE}/tizen-studio/tools/certificate-generator/certificates/distributor/sdk-public/tizen-distributor-signer.p12" password="tizenpkcs12passfordsigner" rootca=""/>
              <profileitem ca="" distributor="2" key="" password="" rootca=""/>
            </profile>
          </profiles>
          EOF

          "$TIZEN" cli-config "profiles.path=${PROFILE_DIR}/profiles.xml"

      - name: Package signed WGT for old Tizen
        shell: bash
        run: |
          set -euo pipefail
          TIZEN="${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin/tizen"
          mkdir -p signed-release
          "$TIZEN" package -t wgt -o signed-release -s KoreaTV-Old -- tizen-standalone/build
          WGT="$(find signed-release -maxdepth 1 -type f -name '*.wgt' -print -quit)"
          test -n "$WGT"
          mv "$WGT" KoreaTV.wgt

      - name: Validate signed WGT contents
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import zipfile

          with zipfile.ZipFile('KoreaTV.wgt') as zf:
              names = set(zf.namelist())
              required = {
                  'config.xml', 'index.html', 'bootstrap.js', 'runtime-version.json',
                  'main.js', 'numeric-remote.js', 'remote-input.js', 'avplay-adapter.js',
                  'channel-policy.js', 'kbs-provider.js', 'style.css',
                  'author-signature.xml', 'signature1.xml'
              }
              missing = sorted(required - names)
              assert not missing, f'KoreaTV.wgt missing required files: {missing}'
              config_bytes = zf.read('config.xml')
              config = config_bytes.decode('utf-8')
              assert '<widget ' in config or '<widget\n' in config
              assert '<tizen:application ' in config
              assert 'PryinsTV01.KoreaTV' in config
              root = ET.fromstring(config_bytes)
              privileges = {
                  node.attrib.get('name')
                  for node in root.findall('{http://tizen.org/ns/widgets}privilege')
              }
              assert 'http://tizen.org/privilege/tv.inputdevice' in privileges
              assert 'http://tizen.org/privilege/tv.window' not in privileges
              index = zf.read('index.html').decode('utf-8')
              assert 'src="channel-policy.js"' in index
              assert 'src="kbs-provider.js"' in index
              assert index.index('src="channel-policy.js"') < index.index('src="kbs-provider.js"') < index.index('src="bootstrap.js"')
              assert 'src="main.js"' not in index
              assert '$WEBAPIS/webapis/webapis.js' in index
              assert 'type="application/avplayer"' in index
              assert 'data-action="watch-tv"' in index
              bootstrap = zf.read('bootstrap.js').decode('utf-8')
              assert 'CHECK_BUDGET_MS = 450' in bootstrap
              assert 'runtime-version.json' in bootstrap
              assert 'avplay-adapter.js' in bootstrap
              remote = zf.read('remote-input.js').decode('utf-8')
              assert 'registerKeyBatch' in remote and 'ChannelUp' in remote and 'ColorF0Red' in remote
              assert 'CHANNEL_DUPLICATE_GUARD_MS' in remote
              assert 'XF86Red' in remote and 'PageUp' in remote
              assert "if (name === 'ChannelUp') return 1;" in remote
              avplay = zf.read('avplay-adapter.js').decode('utf-8')
              assert 'webapis.avplay' in avplay and 'prepareAsync' in avplay and 'setDisplayRect' in avplay
              assert 'cfpwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/' in avplay
              assert 'FGTV.kr@SD' not in avplay and 'GoodTV.kr@SD' not in avplay and 'RUTCTV.kr@SD' not in avplay
              policy = zf.read('channel-policy.js').decode('utf-8')
              assert 'expectedNormalCount: 45' in policy
              assert 'expectedVisibleCount: 47' in policy
              assert 'HLAODTV.kr@SD' not in policy and 'HLDRDTV.kr@SD' not in policy
              kbs = zf.read('kbs-provider.js').decode('utf-8')
              assert "channelCode: '11'" in kbs and "channelCode: '12'" in kbs
              main = zf.read('main.js').decode('utf-8')
              assert 'setTimeout(openMom, 40)' in main
              assert 'avplay.start(channel.url' in main
          print('KoreaTV.wgt verified: signed V2 shell, 45+2=47 channel contract, dynamic KBS, no RF privilege')
          PY

      - name: Package editable project ZIP
        run: |
          cd tizen-standalone/build
          zip -r ../../korea-tv-tizen-project.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: korea-tv-tizen-project
          path: |
            korea-tv-tizen-project.zip
            KoreaTV.wgt
          if-no-files-found: error

      - name: Preserve verified 56-channel rollback release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROLLBACK_TAG='working-56ch-20260820'
          EXPECTED='08fd08c8d0cce52a22019ff3e31cef332497c05e3875a97104471727d1f1fca1'
          if gh release view "$ROLLBACK_TAG" >/dev/null 2>&1; then
            echo "$ROLLBACK_TAG already preserved; leaving it untouched."
            exit 0
          fi
          rm -f rollback-KoreaTV.wgt
          gh release download standalone-latest --pattern KoreaTV.wgt --output rollback-KoreaTV.wgt
          ACTUAL="$(sha256sum rollback-KoreaTV.wgt | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          gh release create "$ROLLBACK_TAG" \
            --target 'a41b6c8df211843f8c143df744422fd081c6207e' \
            --title 'Korea TV - 56 Channels - ✅ 작동 확인 롤백 기준점' \
            --notes 'Samsung KU50UA7050FXKR / Tizen 6.0에서 실제 작동 확인된 56채널 Update 1 기준점. SHA-256 08fd08c8d0cce52a22019ff3e31cef332497c05e3875a97104471727d1f1fca1. V2 이후에도 롤백용으로 보존하며 덮어쓰지 않는다.' \
            rollback-KoreaTV.wgt

      - name: Publish V2 rolling and permanent releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='V2 finalized channel lineup for Samsung Tizen 6. Exactly 47 visible channels: 45 reviewed ordinary channels plus KBS1/KBS2 resolved dynamically through the official KBS live API. MBC is reduced to Chuncheon + Yeosu; SBS group to SBS TV + UBC; FGTV, GoodTV and RUTC TV are excluded. BBS/BTN remain. RF tuner is not included. In TizenBrew Installer use: pryins-bit/tiz'

          if gh release view standalone-latest >/dev/null 2>&1; then
            gh release edit standalone-latest \
              --target "$GITHUB_SHA" \
              --title 'Korea TV V2 - 47 Channels + KBS' \
              --notes "$NOTES" \
              --latest
          else
            gh release create standalone-latest \
              --target "$GITHUB_SHA" \
              --title 'Korea TV V2 - 47 Channels + KBS' \
              --notes "$NOTES" \
              --latest
          fi
          gh release upload standalone-latest KoreaTV.wgt --clobber

          V2_TAG='v2-47ch-20260820'
          if gh release view "$V2_TAG" >/dev/null 2>&1; then
            echo "$V2_TAG already exists; preserving the first successful V2 binary."
          else
            gh release create "$V2_TAG" \
              --target "$GITHUB_SHA" \
              --title 'Korea TV V2 - 47 Channels' \
              --notes "$NOTES" \
              KoreaTV.wgt
          fi

      - name: Publish formal v1.0.0 release checkpoint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'v1.0.0 stable checkpoint')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.0.0'
          TITLE='Korea TV v1.0.0 - Tizen 6 Stable'
          NOTES='First formal stable checkpoint for the confirmed working Samsung Tizen 6 build. Includes Mom OS + AVPlay, exact-once Samsung remote handling, signed standalone KoreaTV.wgt, and the HTTP 429 playlist transport fix. This release intentionally freezes the working app before the previously approved broad channel set is restored on main.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to rewrite the formal stable release"
            exit 1
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            KoreaTV.wgt
