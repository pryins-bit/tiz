name: Build standalone Tizen app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tizen-standalone/**'
      - 'scripts/sync_tizen_standalone.py'
      - '.github/workflows/build-standalone.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tizen-standalone/**'
      - 'scripts/sync_tizen_standalone.py'
      - '.github/workflows/build-standalone.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared JavaScript
        run: |
          node --check app/main.js
          node --check app/numeric-remote.js
      - name: Build standalone project
        run: python scripts/sync_tizen_standalone.py
      - name: Stamp rolling package version without rewriting XML namespaces
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('tizen-standalone/build/config.xml')
          text = path.read_text(encoding='utf-8')
          run_number = int(os.environ['GITHUB_RUN_NUMBER'])
          version = f'0.3.{run_number}'
          updated, count = re.subn(
              r'(<widget\b[^>]*\bversion=")[^"]+("[^>]*>)',
              rf'\g<1>{version}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not stamp widget version')
          path.write_text(updated, encoding='utf-8')
          print('WGT version:', version)
          PY
      - name: Validate Tizen manifest and Installer parser contract
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('tizen-standalone/build/config.xml')
          text = path.read_text(encoding='utf-8')
          root = ET.parse(path).getroot()
          assert root.attrib.get('version')
          assert root.find('{http://www.w3.org/ns/widgets}content') is not None
          assert '<widget ' in text or '<widget\n' in text
          assert '<tizen:application ' in text
          assert 'xmlns:tizen="http://tizen.org/ns/widgets"' in text
          assert '<ns0:widget' not in text
          assert '<ns1:application' not in text
          print('config.xml OK for TizenBrew Installer xml2js parser')
          PY
      - name: Package project ZIP and WGT
        run: |
          cd tizen-standalone/build
          zip -r ../../korea-tv-tizen-project.zip .
          zip -r ../../KoreaTV.wgt .
          cd ../..
          python - <<'PY'
          import zipfile
          for name in ('korea-tv-tizen-project.zip', 'KoreaTV.wgt'):
              with zipfile.ZipFile(name) as zf:
                  names = set(zf.namelist())
                  assert 'config.xml' in names, f'{name}: config.xml missing at package root'
                  assert 'index.html' in names, f'{name}: index.html missing at package root'
                  config = zf.read('config.xml').decode('utf-8')
                  assert '<widget ' in config or '<widget\n' in config, f'{name}: widget prefix rewritten'
                  assert '<tizen:application ' in config, f'{name}: tizen:application prefix missing'
              print(name, 'OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: korea-tv-tizen-project
          path: |
            korea-tv-tizen-project.zip
            KoreaTV.wgt
          if-no-files-found: error
      - name: Publish rolling GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view standalone-latest >/dev/null 2>&1; then
            gh release edit standalone-latest \
              --title 'Korea TV Standalone (latest)' \
              --notes 'Automatically rebuilt from the latest main branch. In TizenBrew Installer use: pryins-bit/tiz' \
              --latest
          else
            gh release create standalone-latest \
              --target "$GITHUB_SHA" \
              --title 'Korea TV Standalone (latest)' \
              --notes 'Automatically rebuilt from the latest main branch. In TizenBrew Installer use: pryins-bit/tiz' \
              --latest
          fi
          gh release upload standalone-latest KoreaTV.wgt --clobber
